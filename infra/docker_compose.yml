# version: "3.9"

services:
  prefect-server:
    image: prefecthq/prefect:2-latest
    container_name: prefect-server
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4200/api/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - etl-net
    restart: unless-stopped

  prefect-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: prefect-worker
    depends_on:
      prefect-server:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../scripts:/app/scripts
      - ../platforms:/app/platforms
      - ../shared:/app/shared
      - ../logs:/app/logs
    command: prefect worker start --pool default
    networks:
      - etl-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio-webcraw
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secure_123@#
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - etl-net
    restart: unless-stopped

  postgres-local:
    image: postgres:15
    container_name: postgres-webcraw
    restart: always
    environment:
      POSTGRES_USER: postgres@user
      POSTGRES_PASSWORD: password@123
      POSTGRES_DB: dataops_webcraw
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../infra/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres@user -d dataops_webcraw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - etl-net

  pipeline-runner:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: pipeline-runner
    depends_on:
      - postgres-local
      - minio
      - prefect-server
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../cli:/app/cli
      - ../flows:/app/flows
      - ../platforms:/app/platforms
      - ../shared:/app/shared
      - ../scripts:/app/scripts
      - ../logs:/app/logs
    command: sleep infinity
    networks:
      - etl-net

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-webcraw
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.master.Master"
      - "--host"
      - "spark-master"
      - "--port"
      - "7077"
      - "--webui-port"
      - "8080"
    networks:
      - etl-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker-webcraw
    depends_on:
      spark-master:
        condition: service_started
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 4g
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
      - "-c"
      - "2"
      - "-m"
      - "4g"
    networks:
      - etl-net

volumes:
  minio_data:
    driver: local
  pg_data:
    driver: local

networks:
  etl-net:
    driver: bridge
