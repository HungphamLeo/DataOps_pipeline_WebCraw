dataops_webcraw:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres@user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'password@123') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dataops_webcraw') }}"
      schema: public
      threads: 4
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres@user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'password@123') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dataops_webcraw') }}"
      schema: public
      threads: 2
